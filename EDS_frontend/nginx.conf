server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # React SPA (client-side routing fallback). API calls go straight to
    # api.eds.afridatai.com — see nginx/conf.d/https.conf.template — so this
    # container only ever serves static files, no backend proxying here.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
