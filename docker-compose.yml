# AfriDATAi EDS — Postgres + Django + React/Vite

services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-eds}
      POSTGRES_USER: ${DB_USER:-eds}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./EDS_backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-eds}
      DB_USER: ${DB_USER:-eds}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    # No published port — only reachable from other containers (nginx
    # proxies apieds.afridatai.com to backend:8000 internally).
    expose:
      - "8000"

  web:
    build:
      context: ./EDS_frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    # No published port — only reachable from nginx, which proxies
    # eds.afridatai.com to web:80 internally.
    expose:
      - "80"
    depends_on:
      - backend

  # Single public entrypoint: terminates TLS for both subdomains and proxies
  # to `web` / `backend` internally. Config is written by deploy.sh (see
  # nginx/conf.d/*.template) so this stays a plain reverse proxy image.
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    depends_on:
      - web
      - backend

  # Issues/renews Let's Encrypt certs for both domains. deploy.sh runs this
  # as a one-shot (`docker compose run --rm certbot ...`) rather than as a
  # long-lived service — it exits after each issuance/renewal attempt.
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot --quiet; done"]

volumes:
  postgres_data:
  certbot_certs:
  certbot_webroot: